name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site && cp index.html style.css main.js Vamsi_tallapudi.pdf _site/
          # cache-bust so a cached old page never pairs with new CSS/JS
          v=${GITHUB_SHA::7}
          sed -i "s/style\.css\"/style.css?v=$v\"/; s/main\.js\"/main.js?v=$v\"/" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
